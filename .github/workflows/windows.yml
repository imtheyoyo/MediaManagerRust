name: Compilation Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --release
      - name: Compilation
        run: cargo build --workspace --release
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force MediaManagerRust | Out-Null
          Copy-Item target/release/mediamanager-gui.exe, target/release/mediamanager.exe, README.md MediaManagerRust/
          Compress-Archive -Path MediaManagerRust -DestinationPath MediaManagerRust-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MediaManagerRust-windows-x64
          path: MediaManagerRust-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MediaManagerRust-windows-x64.zip
          prerelease: true
