name: Compilation Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --release
      - name: Compilation
        run: cargo build --workspace --release
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force MediaManagerRust | Out-Null
          Copy-Item target/release/mediamanager-gui.exe, target/release/mediamanager.exe, README.md MediaManagerRust/
          Compress-Archive -Path MediaManagerRust -DestinationPath MediaManagerRust-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MediaManagerRust-windows-x64
          path: MediaManagerRust-windows-x64.zip
      - name: Version
        id: version
        shell: bash
        run: echo "v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: MediaManagerRust ${{ steps.version.outputs.v }} (préversion)
          target_commitish: ${{ github.sha }}
          files: MediaManagerRust-windows-x64.zip
          prerelease: true
          make_latest: true
