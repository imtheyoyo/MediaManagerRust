[package]
name = "mediamanager-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interface graphique (egui) de MediaManagerRust"

[lib]
name = "mediamanager_gui"
path = "src/lib.rs"

[[bin]]
name = "mediamanager-gui"
path = "src/main.rs"

[dependencies]
# L'intégration avec mediamanager-core / -store / -scrapers viendra plus tard :
# pour l'instant la GUI travaille sur ses propres structures d'affichage.
eframe = "0.37"
# Polices d'emojis monochromes embarquées (NotoEmoji, licence OFL ; emoji-icon-font, MIT) :
# sans elles, les pictogrammes (⚙ 🔔 ✔ ⚠ ▲...) dépendent des polices du système.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
