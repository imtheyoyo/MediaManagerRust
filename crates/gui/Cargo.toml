[package]
name = "mediamanager-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interface graphique (egui) de MediaManagerRust"

[lib]
name = "mediamanager_gui"
path = "src/lib.rs"

[[bin]]
name = "mediamanager-gui"
path = "src/main.rs"

[dependencies]
# Services de l'application (la GUI garde ses structures d'affichage : conversion dans
# `conversion.rs`, branchement dans `source_application.rs`).
mediamanager-app.workspace = true
mediamanager-core.workspace = true
mediamanager-store.workspace = true
mediamanager-scrapers.workspace = true
eframe = "0.37"
# Polices d'emojis monochromes embarquées (NotoEmoji, licence OFL ; emoji-icon-font, MIT) :
# sans elles, les pictogrammes (⚙ 🔔 ✔ ⚠ ▲...) dépendent des polices du système.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
regex.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"
