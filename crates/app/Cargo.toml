[package]
name = "mediamanager-app"
description = "Services de l'application : orchestration du scan, des scrapers, des NFO, du renommage et du stockage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediamanager-core.workspace = true
mediamanager-scrapers.workspace = true
mediamanager-store.workspace = true
mediamanager-gabarit.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
