[package]
name = "mediamanager-cli"
description = "Outil en ligne de commande de MediaManagerRust"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mediamanager"
path = "src/main.rs"

[dependencies]
mediamanager-app.workspace = true
mediamanager-core.workspace = true
mediamanager-store.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
rpassword = "7"
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
