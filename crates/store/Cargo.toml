[package]
name = "mediamanager-store"
description = "Persistance de la médiathèque et des réglages"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediamanager-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Trousseau du système : uniquement là où un magasin natif persistant existe
# sans dépendance système supplémentaire (Windows, macOS). Ailleurs : repli
# sur un fichier à permissions restreintes (voir `secrets.rs`).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
