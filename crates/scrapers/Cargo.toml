[package]
name = "mediamanager-scrapers"
description = "Récupération des métadonnées en ligne"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
async-trait = "0.1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
wiremock = "0.6"
